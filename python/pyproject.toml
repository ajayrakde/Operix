[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyulix"
version = "1.2.0b2"
description = "Pyulix: independent Python visual automation bridge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.8"
authors = [{name = "Ajay Rakde"}]
maintainers = [{name = "Ajay Rakde"}]
keywords = ["visual-testing", "automation", "ocr", "sikuli", "gui-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ajayrakde/Operix"
Repository = "https://github.com/ajayrakde/Operix"

Issues = "https://github.com/ajayrakde/Operix/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pyulix = ["_api_schema.json.gz", "py.typed", "*.pyi", "**/*.pyi"]
