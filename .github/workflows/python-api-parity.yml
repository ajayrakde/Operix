name: Python Java API parity

on:
  push:
    branches: ['python/java-api-parity']
    paths:
      - 'python/**'
      - 'jvm-bridge/**'
      - 'tools/**'
      - 'docs/java-api-*.json.gz'
      - 'docs/python-api-coverage.md'
      - '.github/workflows/python-api-parity.yml'
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test JVM bridge
        working-directory: jvm-bridge
        run: mvn -B package
      - name: Install Python test dependencies
        run: python -m pip install -e ./python pytest
      - name: Test Python wrappers against real JVM and bundled OCR
        env:
          OCULIX_OCR_TESTS: '1'
        run: python -m pytest python/tests -q
      - name: Start Linux desktop
        if: runner.os == 'Linux'
        run: Xvfb :99 -screen 0 1280x1024x24 > /tmp/operix-xvfb.log 2>&1 &
      - name: Validate real desktop capture, OCR, input and callbacks
        env:
          DISPLAY: ':99'
          OCULIX_DESKTOP_TESTS: '1'
        run: python -m pytest python/tests/test_desktop.py -q
      - name: Save desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: test-artifacts/
      - name: Check generated Python methods and overload stubs
        run: python tools/generate_python_api.py --check
      - name: Build and check Python distributions
        run: |
          python -m pip install build twine
          python -m build python
          python -m twine check python/dist/*
          python tools/verify_python_wheel.py
      - name: Validate packaged autocomplete and nullable type hints
        run: |
          python -m pip install pyright==1.1.414
          python -m pip install --force-reinstall python/dist/oculix_operix-1.2.0b1-py3-none-any.whl
          python tools/verify_python_typing.py
      - name: Check bounded dependency inventory
        run: python tools/inventory_python_support.py --jar jvm-bridge/target/operix-jvm-bridge-1.2.0b1.jar --check
      - name: Check Java API inventory and explicit wrapper coverage
        run: python tools/inventory_java_api.py --check

  release:
    needs: validate
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified release artifacts
        run: |
          mvn -B -f jvm-bridge/pom.xml package
          python -m pip install build twine
          python -m build python
          python -m twine check python/dist/*
      - name: Check immutable release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view jvm-bridge-1.2.0b1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish fork JVM bridge and Python distributions
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: jvm-bridge-1.2.0b1
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          name: Operix typed support beta 1.2.0b1
          body: |
            Beta: typed dependency facades, nullable results and opaque handles for Oculix 4.0.0.
            Validated Linux and Windows OCR, desktop capture/search/input,
            background callbacks and clean wheel installation.
            Distribution name: oculix-operix. Python import: oculix.
          files: |
            jvm-bridge/target/operix-jvm-bridge-1.2.0b1.jar
            python/dist/*
      - name: Verify automatic fork JAR download and installed wheel OCR
        run: python tools/verify_python_wheel.py --download
      - name: Check PyPI publishing configuration
        id: pypi
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::PyPI publication pending: configure PYPI_API_TOKEN with access to oculix-operix.'
            echo 'GitHub artifacts are published. PyPI requires PYPI_API_TOKEN with access to oculix-operix.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish oculix-operix to PyPI
        if: steps.pypi.outputs.ready == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
