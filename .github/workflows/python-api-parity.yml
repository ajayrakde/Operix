name: Python Java API parity

on:
  push:
    branches: ['python/java-api-parity']
    paths:
      - 'python/**'
      - 'jvm-bridge/**'
      - 'tools/**'
      - 'docs/java-api-*.json.gz'
      - 'docs/python-api-coverage.md'
      - '.github/workflows/python-api-parity.yml'
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test JVM bridge
        working-directory: jvm-bridge
        run: mvn -B package
      - name: Install Python test dependencies
        run: python -m pip install -e ./python pytest
      - name: Test Python wrappers against real JVM and bundled OCR
        env:
          OCULIX_OCR_TESTS: '1'
        run: python -m pytest python/tests -q
      - name: Start Linux desktop
        if: runner.os == 'Linux'
        run: Xvfb :99 -screen 0 1280x1024x24 > /tmp/operix-xvfb.log 2>&1 &
      - name: Validate real desktop capture, OCR, input and callbacks
        env:
          DISPLAY: ':99'
          OCULIX_DESKTOP_TESTS: '1'
        run: python -m pytest python/tests/test_desktop.py -q
      - name: Save desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: test-artifacts/
      - name: Check generated Python methods and overload stubs
        run: python tools/generate_python_api.py --check
      - name: Build and check Python distributions
        run: |
          python -m pip install build twine
          python -m build python
          python -m twine check python/dist/*
          python tools/verify_python_wheel.py
      - name: Check Java API inventory and explicit wrapper coverage
        run: python tools/inventory_java_api.py --check
